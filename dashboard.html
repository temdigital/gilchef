<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<title>Painel do Chef</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
display:flex;
}

.sidebar{
width:240px;
background:#000;
height:100vh;
padding:20px;
position:fixed;
}

.sidebar h2{
color:#d4af37;
}

.sidebar a{
display:block;
color:white;
padding:10px;
text-decoration:none;
margin-top:10px;
}

.sidebar a:hover{
background:#1f1f1f;
}

.main{

margin-left:240px;
padding:30px;
width:100%;
}

.cards{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:30px;

}

.card{

background:#1a1a1a;
padding:20px;
border-radius:10px;

}

.card h3{
color:#d4af37;
}

.section{

margin-top:40px;

}

input{

padding:10px;
border:none;
border-radius:6px;
margin:5px;

}

button{

padding:10px;
background:#d4af37;
border:none;
cursor:pointer;
border-radius:6px;

}

.list{

margin-top:20px;

}

.item{

display:flex;
justify-content:space-between;
padding:10px;
border-bottom:1px solid #333;

}

.delete{

background:red;
color:white;
padding:5px 10px;
border:none;
cursor:pointer;

}

.alert{

position:fixed;
top:20px;
right:20px;
background:#222;
padding:15px;
border-left:5px solid #d4af37;
animation:fade .4s;

}

@keyframes fade{

from{opacity:0;transform:translateY(-10px);}
to{opacity:1;}

}

iframe{

width:100%;
height:300px;
border:none;
border-radius:10px;

}

</style>

</head>

<body>

<div class="sidebar">

<h2>Chef Panel</h2>

<a href="#">Dashboard</a>
<a href="#agenda">Agenda</a>
<a href="#clientes">Clientes</a>
<a href="#videos">Vídeos</a>

<button onclick="logout()">Sair</button>

</div>

<div class="main">

<h1>Painel do Chef</h1>

<div class="cards">

<div class="card">

<h3>Eventos</h3>

<p id="totalAgenda">0</p>

</div>

<div class="card">

<h3>Clientes</h3>

<p id="totalClientes">0</p>

</div>

<div class="card">

<h3>Pedidos</h3>

<p id="totalPedidos">0</p>

</div>

</div>


<div id="agenda" class="section">

<h2>Agenda</h2>

<input type="date" id="dataAgenda">

<input type="text" id="eventoAgenda" placeholder="Evento">

<button onclick="salvarAgenda()">Salvar</button>

<div class="list" id="listaAgenda"></div>

</div>


<div id="clientes" class="section">

<h2>Clientes</h2>

<input type="text" id="nomeCliente" placeholder="Nome">

<input type="text" id="telefoneCliente" placeholder="Telefone">

<button onclick="salvarCliente()">Salvar</button>

<div class="list" id="listaClientes"></div>

</div>


<div id="videos" class="section">

<h2>Vídeos do YouTube</h2>

<input type="text" id="linkVideo" placeholder="Link youtube">

<button onclick="salvarVideo()">Salvar</button>

<div class="list" id="listaVideos"></div>

</div>

</div>

<script>

const supabase = window.supabase.createClient(

"https://lsaalnektrjhrcdylbll.supabase.co",
"sb_publishable_57YTUbwht34cT1C70Y4e5A_UBpnFnmy"

)

function alerta(msg){

const div=document.createElement("div")

div.className="alert"

div.innerText=msg

document.body.appendChild(div)

setTimeout(()=>div.remove(),3000)

}

async function carregarDashboard(){

carregarAgenda()

carregarClientes()

}

async function salvarAgenda(){

let data=document.getElementById("dataAgenda").value
let evento=document.getElementById("eventoAgenda").value

if(!evento){

alerta("Digite o evento")

return

}

await supabase.from("agenda").insert([{data,evento}])

alerta("Evento salvo")

carregarAgenda()

}

async function carregarAgenda(){

let {data}=await supabase.from("agenda").select("*")

let lista=document.getElementById("listaAgenda")

lista.innerHTML=""

document.getElementById("totalAgenda").innerText=data.length

data.forEach(item=>{

lista.innerHTML+=`

<div class="item">

${item.data} - ${item.evento}

<button class="delete" onclick="deletarAgenda(${item.id})">Excluir</button>

</div>

`

})

}

async function deletarAgenda(id){

await supabase.from("agenda").delete().eq("id",id)

alerta("Evento removido")

carregarAgenda()

}

async function salvarCliente(){

let nome=document.getElementById("nomeCliente").value
let telefone=document.getElementById("telefoneCliente").value

await supabase.from("usuarios").insert([{nome,telefone}])

alerta("Cliente salvo")

carregarClientes()

}

async function carregarClientes(){

let {data}=await supabase.from("usuarios").select("*")

let lista=document.getElementById("listaClientes")

lista.innerHTML=""

document.getElementById("totalClientes").innerText=data.length

data.forEach(item=>{

lista.innerHTML+=`

<div class="item">

${item.nome} - ${item.telefone}

<button class="delete" onclick="deletarCliente(${item.id})">Excluir</button>

</div>

`

})

}

async function deletarCliente(id){

await supabase.from("usuarios").delete().eq("id",id)

alerta("Cliente removido")

carregarClientes()

}

async function salvarVideo(){

let link=document.getElementById("linkVideo").value

await supabase.from("videos").insert([{link}])

alerta("Vídeo salvo")

carregarVideos()

}

async function carregarVideos(){

let {data}=await supabase.from("videos").select("*")

let lista=document.getElementById("listaVideos")

lista.innerHTML=""

data.forEach(v=>{

let embed=v.link.replace("watch?v=","embed/")

lista.innerHTML+=`

<div class="item">

<iframe src="${embed}"></iframe>

<button class="delete" onclick="deletarVideo(${v.id})">Excluir</button>

</div>

`

})

}

async function deletarVideo(id){

await supabase.from("videos").delete().eq("id",id)

alerta("Vídeo removido")

carregarVideos()

}

function logout(){

window.location.href="login.html"

}

carregarDashboard()

</script>

</body>

</html>
