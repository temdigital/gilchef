<div class="container py-4">

<h2 class="mb-4">Clientes</h2>

<div class="card shadow p-3 mb-4">

<form id="formCliente">

<div class="row g-3">

<div class="col-md-4">

<input class="form-control" id="nome" placeholder="Nome">

</div>

<div class="col-md-3">

<input class="form-control" id="telefone" placeholder="Telefone">

</div>

<div class="col-md-3">

<input class="form-control" id="email" placeholder="Email">

</div>

<div class="col-md-2">

<button class="btn btn-warning w-100">Salvar</button>

</div>

</div>

</form>

</div>

<table class="table table-striped">

<thead>

<tr>

<th>Nome</th>
<th>Telefone</th>
<th>Email</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="listaClientes"></tbody>

</table>

</div>
