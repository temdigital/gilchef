<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pedidos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/admin.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
<script src="js/pedidos.js"></script>

</head>

<body>

<div class="d-flex">

<div class="sidebar p-3">

<h4 class="text-white">Sistema</h4>

<a href="dashboard.html">Dashboard</a>

<a id="menuUsuarios" href="usuarios.html">Usuários</a>

<a href="pedidos.html">Pedidos</a>

<a href="agenda.html">Agenda</a>

</div>

<div class="flex-grow-1">

<nav class="navbar bg-light px-4">

<span id="usuarioInfo"></span>

<button class="btn btn-warning" onclick="logout()">Sair</button>

</nav>

<div class="container py-4">

<h2 class="mb-4">Pedidos</h2>

<div class="card shadow p-3 mb-4">

<form id="formPedido">

<div class="row g-3">

<div class="col-md-3">

<input class="form-control" id="cliente" placeholder="Cliente">

</div>

<div class="col-md-3">

<input class="form-control" id="telefone" placeholder="Telefone">

</div>

<div class="col-md-4">

<textarea class="form-control" id="servico" placeholder="Serviço"></textarea>

</div>

<div class="col-md-2">

<select id="status" class="form-select">

<option>novo</option>
<option>preparando</option>
<option>saiu_entrega</option>
<option>entregue</option>

</select>

</div>

</div>

<button class="btn btn-warning mt-3">

Salvar Pedido

</button>

</form>

</div>

<table class="table table-striped">

<thead>

<tr>

<th>Cliente</th>
<th>Telefone</th>
<th>Serviço</th>
<th>Status</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="listaPedidos"></tbody>

</table>

</div>

</div>

</div>

</body>
</html>
