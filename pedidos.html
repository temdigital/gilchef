<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Pedidos</title>

<link rel="stylesheet" href="css/admin.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>
<script src="js/layout.js"></script>
<script src="js/pedidos.js"></script>

</head>

<body>

<div class="sidebar">

<h3>Sistema</h3>

<a href="dashboard.html">Dashboard</a>

<a id="menuClientes" href="clientes.html">Clientes</a>

<a id="menuUsuarios" href="usuarios.html">Usuários</a>

<a href="pedidos.html">Pedidos</a>

<a href="agenda.html">Agenda</a>

</div>

<div class="topbar">

<span id="usuarioInfo"></span>

<button onclick="logout()" class="btn">Sair</button>

</div>

<div class="content">

<h2>Pedidos</h2>

<div class="form-box">

<form id="formPedido">

<div class="form-row">

<input id="cliente" placeholder="Cliente">

<input id="telefone" placeholder="Telefone">

<textarea id="servico" placeholder="Serviço"></textarea>

<select id="status">

<option>novo</option>
<option>preparando</option>
<option>entregue</option>

</select>

<button class="btn">Salvar Pedido</button>

</div>

</form>

</div>

<table>

<thead>

<tr>

<th>Cliente</th>
<th>Telefone</th>
<th>Serviço</th>
<th>Status</th>
<th>Ações</th>

</tr>

</thead>

<tbody id="listaPedidos"></tbody>

</table>

</div>

</body>
</html>
